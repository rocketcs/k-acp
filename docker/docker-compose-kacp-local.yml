services:
  apboa-mysql:
    container_name: k-acp-mysql

  apboa-redis:
    container_name: k-acp-redis

  apboa-pgvector:
    container_name: k-acp-pgvector

  apboa-console:
    container_name: k-acp-console
    ports:
      - "23060:3060"

  apboa-runtime:
    container_name: k-acp-runtime
    environment:
      # 面向业务用户的对话不展示模型内部思考或查询计划。
      AGENTSCOPE_AGUI_ENABLE_REASONING: "false"
      # AgentScope -> Langfuse/OpenTelemetry tracing. 从 Langfuse 项目页创建 API key 后启用。
      AGENTSCOPE_TRACING_ENABLED: ${AGENTSCOPE_TRACING_ENABLED:-false}
      AGENTSCOPE_TRACING_ENDPOINT: ${AGENTSCOPE_TRACING_ENDPOINT:-http://host.docker.internal:3000/api/public/otel/v1/traces}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INGESTION_VERSION: ${LANGFUSE_INGESTION_VERSION:-4}
      # 高召回检索包含计划、受控搜索和批量原文解析，60 秒会在完成前中断。
      APBOA_TOOL_EXECUTION_TIMEOUT_SECONDS: "240"
      # 财务制度自定义 Tool 的只读 Neo4j 连接；数据库通过 k-acp-local 网络中的 neo4j-finance 别名访问。
      FINANCE_NEO4J_HTTP_URL: ${FINANCE_NEO4J_HTTP_URL:-http://neo4j-finance:7474}
      FINANCE_NEO4J_USER: ${FINANCE_NEO4J_USER:-neo4j}
      FINANCE_NEO4J_PASSWORD: ${FINANCE_NEO4J_PASSWORD}
    ports:
      - "23061:3061"
    volumes:
      - ../scripts:/app/scripts:ro

  apboa-proxy:
    container_name: k-acp-proxy
    ports:
      - "23062:3062"

  apboa-websocket:
    container_name: k-acp-websocket
    environment:
      APBOA_NODE_ID: k-acp-local-websocket
      APBOA_HOST_NAME: k-acp-local-websocket
      APBOA_HOST_IP: host.docker.internal
    ports: !override
      - "23064:3064"

  apboa-frontend:
    container_name: k-acp-frontend

networks:
  apboa_simple:
    name: k-acp-local
