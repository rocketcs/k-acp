services:
  apboa-mysql:
    container_name: k-acp-mysql

  apboa-redis:
    container_name: k-acp-redis

  apboa-pgvector:
    container_name: k-acp-pgvector

  apboa-console:
    container_name: k-acp-console
    ports:
      - "23060:3060"

  apboa-runtime:
    container_name: k-acp-runtime
    environment:
      # 面向业务用户的对话不展示模型内部思考或查询计划。
      AGENTSCOPE_AGUI_ENABLE_REASONING: "false"
      # 高召回检索包含计划、受控搜索和批量原文解析，60 秒会在完成前中断。
      APBOA_TOOL_EXECUTION_TIMEOUT_SECONDS: "240"
    ports:
      - "23061:3061"
    volumes:
      - ../scripts:/app/scripts:ro

  apboa-proxy:
    container_name: k-acp-proxy
    ports:
      - "23062:3062"

  apboa-websocket:
    container_name: k-acp-websocket
    environment:
      APBOA_NODE_ID: k-acp-local-websocket
      APBOA_HOST_NAME: k-acp-local-websocket
      APBOA_HOST_IP: host.docker.internal
    ports: !override
      - "23064:3064"

  apboa-frontend:
    container_name: k-acp-frontend

networks:
  apboa_simple:
    name: k-acp-local
