<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金智维使用手册</title>
    <style>
      /* 遮罩层样式 */
      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f5f5f7;
      }

      /* Logo容器 */
      .logo-container {
        width: 80px;
        height: 80px;
      }

      .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        animation: brandPulse 1.4s ease-in-out infinite;
      }

      @keyframes brandPulse {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="doc-app">
      <div class="loading-overlay">
        <div class="logo-container">
          <img src="/favicon.ico" alt="金智维">
        </div>
      </div>
    </div>
    <script type="module" src="/src/doc/main.ts"></script>
  </body>
</html>
