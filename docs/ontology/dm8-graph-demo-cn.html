    function normalize(input){const data=input&&typeof input==='object'?input:{};const nodes=Array.isArray(data.nodes)?data.nodes.filter(n=>n&&n.id):[];const ids=new Set(nodes.map(n=>n.id));const edges=Array.isArray(data.edges)?data.edges.filter(e=>e&&ids.has(e.source)&&ids.has(e.target)).map(e=>({...e,label:e.label||'相关'})):[];const stats=data.stats||{};const amount=stats.amount??nodes.reduce((sum,n)=>sum+Number(n.properties?.金额??n.props?.金额??0),0);return {...data,title:data.title||'电力物资知识图谱',subtitle:data.subtitle||'中文关系子图',source:data.source||'本地模拟数据',stats:{nodeCount:stats.nodeCount??nodes.length,edgeCount:stats.edgeCount??edges.length,amount},nodes,edges}}

    function relatedSummary(node){if(!node||!currentData)return [];const es=currentData.edges||[];const byId={};(currentData.nodes||[]).forEach(n=>byId[n.id]=n);const out=[];const kind=node.kind;const fmtY=v=>{const n=Number(v||0);return n>=1e8?(n/1e8).toFixed(2)+'亿':n>=1e4?(n/1e4).toFixed(0)+'万':String(n)};

      if(wh.length)out.push(['所在仓库',wh.map(x=>x.label).join('、')]);
      if(mat.length)out.push(['对应物资',mat.map(x=>x.label).join('、')]);
      if(sup.length)out.push(['供应商',sup.map(x=>x.label).join('、')]);
    }else if(kind==='物资'){
      const sups=new Set(),whs=new Set();let amt=0,cnt=0;
      es.filter(e=>e.label==='对应物资'&&e.target===node.id).forEach(e=>{
        const st=byId[e.source];if(!st)return;cnt++;amt+=Number((st.properties||{}).金额||0);
        es.filter(x=>x.label==='由供应商提供'&&x.source===st.id).forEach(x=>{const sp=byId[x.target];if(sp)sups.add(sp.label)});
        es.filter(x=>x.label==='包含库存'&&x.target===st.id).forEach(x=>{const w=byId[x.source];if(w)whs.add(w.label.replace(/·[0-9.]+[亿万]$/,''))});
      });
      out.push(['供货供应商',[...sups].join('、')||'—']);
      out.push(['库存笔数',String(cnt)]);
      if(cnt)out.push(['库存金额',fmtY(amt)+'元']);
      out.push(['所在仓库',[...whs].join('、')||'—']);
    }else if(kind==='供应商'){
      const whs=new Set();let amt=0,cnt=0;
      es.filter(e=>e.label==='由供应商提供'&&e.target===node.id).forEach(e=>{const st=byId[e.source];if(!st)return;cnt++;amt+=Number((st.properties||{}).金额||0);es.filter(x=>x.label==='包含库存'&&x.target===st.id).forEach(x=>{const w=byId[x.source];if(w)whs.add(w.label.replace(/·[0-9.]+[亿万]$/,''))})});
      if(cnt)out.push(['本图库存笔数',String(cnt)]);
      if(cnt)out.push(['本图库存金额',fmtY(amt)+'元']);
      if(whs.size)out.push(['供货仓库',whs.size+' 个']);
    }else if(kind==='仓库'){
      const sups=new Set();let amt=0,cnt=0;
      es.filter(e=>e.label==='包含库存'&&e.source===node.id).forEach(e=>{const st=byId[e.target];if(!st)return;cnt++;amt+=Number((st.properties||{}).金额||0);
        es.filter(x=>x.label==='由供应商提供'&&x.target===st.id).forEach(x=>{const sp=byId[x.source];if(sp)sups.add(sp.label)});
      });
      if(cnt){out.push(['本图库存笔数',String(cnt)]);out.push(['本图库存金额',fmtY(amt)+'元'])}
      if(sups.size)out.push(['涉及供应商',[...sups].join('、')]);
    }
    return out}
    function inspector(node){if(!node){$('inspector').innerHTML='<div class="inspector-empty"><div><div class="glyph">◎</div>点击图谱中的节点<br>查看业务属性</div></div>';return}const props=node.properties||node.props||{};const rows=Object.entries(props).filter(([k,v])=>v!==null&&v!==undefined&&v!=='').map(([k,v])=>`<div class="prop"><span class="prop-key">${esc(k)}</span><span class="prop-value">${esc(String(v))}</span></div>`).join('');const rel=relatedSummary(node);const relHtml=rel.length?rel.map(([k,v])=>`<div class="prop"><span class="prop-key">${esc(k)}</span><span class="prop-value">${esc(String(v))}</span></div>`).join(''):'';$('inspector').innerHTML=`<div><div class="node-badge" style="color:${kindColor(node.kind)}"><i class="node-dot"></i>${esc(node.kind||'实体')}</div><div class="node-title">${esc(stockValueName(node)||node.id)}</div><div class="props">${relHtml}${rows||'<div class="subtle" style="padding-top:12px">该节点没有附加属性</div>'}</div></div>`}
    function renderGraph(input){currentData=normalize(input);updateChrome(currentData);$('empty-state').hidden=currentData.nodes.length>0;if(!window.echarts){toast('图表组件未加载，无法绘制图谱');return}if(!chart)chart=echarts.init($('graph'));const data=currentData.nodes.map(n=>({...n,name:n.kind==='库存记录'?stockValueName(n):(n.label||n.name||n.id),symbolSize:n.kind==='仓库'?54:n.kind==='区域'?32:n.kind==='物资'?30:n.kind==='库存记录'?22:26,itemStyle:{color:kindColor(n.kind),shadowBlur:n.kind==='仓库'?12:5,shadowColor:kindColor(n.kind)},label:{show:showLabels,position:'right',color:'#1d4477',fontSize:n.kind==='仓库'?11:9,formatter:p=>p.data.name}}));const links=currentData.edges.map(e=>({source:e.source,target:e.target,rel:e.label,label:e.label,lineStyle:{color:kindColor((currentData.nodes.find(n=>n.id===e.source)||{}).kind),opacity:.55},edgeSymbol:['none','arrow']}));chart.clear();chart.setOption({backgroundColor:'transparent',animationDuration:900,animationEasing:'cubicOut',tooltip:{backgroundColor:'#ffffff',borderColor:'#9dc0ef',textStyle:{color:'#173a63',fontSize:10},formatter:p=>p.dataType==='node'?`<b>${esc(p.data.name)}</b><br><span style="color:#82a9ac">类型：${esc(p.data.kind||'实体')}</span>`:`关系：${esc(p.data.rel||'相关')}${p.data.value?' · '+p.data.value:''}`},series:[{type:'graph',layout:'force',roam:true,draggable:true,data,links,force:{repulsion:330,gravity:.09,edgeLength:118,friction:.18},lineStyle:{width:.6,curveness:.12},edgeLabel:{show:showLabels,fontSize:9,color:'#92400e',formatter:p=>p.data.label},emphasis:{focus:'adjacency',lineStyle:{width:1.5,opacity:1},label:{show:true}}}]});chart.off('click');chart.on('click',p=>{if(p.dataType==='node')inspector(currentData.nodes.find(n=>n.id===p.data.id))});inspector(null);if(currentView==='table')setView('table')}
    let currentView='graph';let tableSort={key:'amount',dir:-1};const fmtFull=v=>{const n=Number(v||0);return Number.isFinite(n)?n.toLocaleString('zh-CN',{maximumFractionDigits:2}):'—'};const TABLE_COLUMNS=[{key:'material',label:'物资名称'},{key:'model',label:'型号'},{key:'qty',label:'数量',num:true},{key:'unit',label:'计量单位'},{key:'price',label:'单价(元)',num:true},{key:'amount',label:'金额(元)',num:true},{key:'voltage',label:'电压等级(千伏)',num:true},{key:'date',label:'入库日期'},{key:'supplier',label:'供应商'},{key:'project',label:'归属项目'},{key:'purpose',label:'用途'}];
    function edgeTarget(id,label){const e=(currentData.edges||[]).find(x=>x.source===id&&x.label===label);return e&&(currentData.nodes||[]).find(n=>n.id===e.target)}
    function tableModeData(){const nodes=currentData.nodes||[];if(nodes.some(n=>n.kind==='库存记录')){return {mode:'inventory',kindName:'库存记录',columns:TABLE_COLUMNS,rows:nodes.filter(n=>n.kind==='库存记录').map(n=>{const p=n.properties||{};const m=edgeTarget(n.id,'对应物资')||{};const s=edgeTarget(n.id,'由供应商提供')||{};const j=edgeTarget(n.id,'归属项目')||{};return {id:n.id,node:n,material:m.label||m.name||'—',model:(m.properties||{}).型号||'—',qty:p.数量??'—',unit:p.计量单位||'—',price:p.单价??'—',amount:p.金额??'—',voltage:p.电压等级千伏||'—',date:p.入库日期||'—',supplier:s.label||s.name||'—',project:j.label||j.name||'—',purpose:p.用途||'—'}})}}
    const kinds={};nodes.forEach(n=>kinds[n.kind]=(kinds[n.kind]||0)+1);const kind=Object.keys(kinds).sort((a,b)=>kinds[b]-kinds[a])[0]||'实体';const sel=nodes.filter(n=>n.kind===kind);const freq={},order={};sel.forEach(n=>Object.keys(n.properties||{}).forEach((k,i)=>{if(k==='名称')return;freq[k]=(freq[k]||0)+1;if(!(k in order))order[k]=i}));const keys=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]||order[a]-order[b]).slice(0,10);const columns=[{key:'__label',label:kind+'名称'},...keys.map(k=>({key:k,label:k,num:sel.some(n=>typeof (n.properties||{})[k]==='number')}))];const rows=sel.map(n=>{const r={id:n.id,node:n,__label:n.label||n.name||n.id};Object.keys(n.properties||{}).forEach(k=>{r[k]=n.properties[k]});return r});return {mode:'generic',kindName:kind,rows,columns}}
    function renderTable(){const t=tableModeData();const rows=t.rows.slice();if(!rows.some(r=>r[tableSort.key]!==undefined&&r[tableSort.key]!==null)){const numCol=t.columns.find(c=>c.num&&(String(c.key).includes('金额')||String(c.key).includes('数量')));tableSort={key:numCol?numCol.key:t.columns[0].key,dir:numCol?-1:1}}rows.sort((a,b)=>{const x=a[tableSort.key],y=b[tableSort.key];const nx=Number(x),ny=Number(y);const r=!isNaN(nx)&&!isNaN(ny)&&x!==''&&y!==''?nx-ny:String(x??'').localeCompare(String(y??''),'zh-CN');return r*tableSort.dir});$('table-head').innerHTML='<tr>'+t.columns.map(c=>`<th data-key="${esc(c.key)}" class="${c.num?'num':''}">${esc(c.label)}${tableSort.key===c.key?(tableSort.dir<0?' ↓':' ↑'):''}</th>`).join('')+'</tr>';$('table-body').innerHTML=rows.map(r=>{if(t.mode==='inventory'){return `<tr data-id="${esc(r.id)}"><td>${esc(r.material)}</td><td class="muted">${esc(r.model)}</td><td class="num">${r.qty}</td><td class="muted">${esc(r.unit)}</td><td class="num">${fmtFull(r.price)}</td><td class="num amt">${fmtFull(r.amount)}</td><td class="num">${r.voltage}</td><td class="muted">${esc(r.date)}</td><td>${esc(r.supplier)}</td><td class="muted">${esc(r.project)}</td><td class="muted">${esc(r.purpose)}</td></tr>`}return '<tr data-id="'+esc(r.id)+'">'+t.columns.map(c=>{const v=r[c.key];const isAmt=c.num&&String(c.key).includes('金额');const cls=(c.num?'num':'')+(isAmt?' amt':'');const txt=v==null||v===''?'—':(typeof v==='number'?fmtFull(v):esc(String(v)));return `<td class="${cls}">${txt}</td>`}).join('')+'</tr>'}).join('')||`<tr><td colspan="${t.columns.length}" class="muted" style="text-align:center;padding:24px">本次查询没有${t.kindName}数据</td></tr>`;const amtKey=t.mode==='inventory'?'amount':(t.columns.find(c=>c.num&&String(c.key).includes('金额'))||{}).key;const total=amtKey?rows.reduce((s,r)=>s+Number(r[amtKey]||0),0):null;$('table-foot').textContent=`共 ${rows.length} ${t.mode==='inventory'?'条库存记录':'个'+t.kindName}${total!=null?' · 合计 '+fmtMoney(total)+' 元':''} · 点击行查看节点属性 · 点击表头排序`;document.querySelectorAll('#table-head th').forEach(th=>th.onclick=()=>{const k=th.dataset.key;if(tableSort.key===k)tableSort.dir*=-1;else{tableSort.key=k;tableSort.dir=-1}renderTable()});document.querySelectorAll('#table-body tr[data-id]').forEach(tr=>tr.onclick=()=>inspector(currentData.nodes.find(n=>n.id===tr.dataset.id)))}
    function setView(view){currentView=view;$('view-graph-btn').classList.toggle('active',view==='graph');$('view-table-btn').classList.toggle('active',view==='table');const table=view==='table';$('table-view').hidden=!table;$('graph').style.display=table?'none':'';const emptyVisible=!table&&(!currentData||currentData.nodes.length===0);$('empty-state').hidden=!emptyVisible;$('reset-btn').style.display=table?'none':'';$('labels-btn').style.display=table?'none':'';$('canvas-hint').textContent=table?'表格视图 · 点击表头排序 · 点击行查看属性':'拖拽节点 · 滚轮缩放 · 点击查看属性';if(table){renderTable()}else if(chart){chart.resize();const opt=chart.getOption();if((!opt.series||!opt.series.length)&&currentData)renderGraph(currentData)}}
    async function loadGraphData(url){try{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();renderGraph(data);toast('已加载外部图谱数据',true)}catch(error){renderGraph(FALLBACK);$('status-text').textContent='已回退内置示例';toast(`外部数据加载失败：${error.message}；已回退内置示例`)}}
    function boot(){const external=new URLSearchParams(location.search).get('data');if(external)loadGraphData(external);else if(window.__GRAPH_DATA__)renderGraph(window.__GRAPH_DATA__);else renderGraph(FALLBACK);$('reset-btn').onclick=()=>{if(chart&&currentData){renderGraph(currentData);toast('已重置图谱布局',true)}};$('labels-btn').onclick=()=>{showLabels=!showLabels;$('labels-btn').textContent=showLabels?'隐藏标签':'显示标签';if(currentData)renderGraph(currentData)};$('view-graph-btn').onclick=()=>setView('graph');$('view-table-btn').onclick=()=>setView('table');setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false}),1000)}
    window.renderGraph=renderGraph;window.loadGraphData=loadGraphData;window.inspectNode=id=>{const n=currentData.nodes.find(n=>n.id===id);if(n)inspector(n);return n||null};window.addEventListener('resize',()=>chart?.resize());boot();
  </script>
